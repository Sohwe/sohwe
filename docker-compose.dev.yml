services:
  postgres:
    image: postgres:16-alpine
    container_name: sohwe-db-dev
    environment:
      POSTGRES_DB: sohwe_dev
      POSTGRES_USER: sohwe
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Without -d, pg_isready defaults to a DB named like the user ("sohwe"), which we don't create.
      test: ["CMD-SHELL", "pg_isready -U sohwe -d sohwe_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sohwe-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    # See note in docker-compose.prod.yml: Traefik <3.7 hardcodes Docker
    # API 1.24 which Docker Engine 29.x rejects. Keep this in sync with prod.
    image: traefik:v3.7
    container_name: sohwe-traefik-dev
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via HTTP-01 challenge. Only triggers when an app container
      # declares traefik.*.tls.certresolver=letsencrypt (i.e. when the operator
      # flips SOHWE_HTTPS_ENABLED=true *and* an app has a real public domain).
      # SOHWE_ACME_EMAIL is required by Let's Encrypt; set a harmless default
      # for dev so Compose doesn't complain when HTTPS is unused.
      - --certificatesresolvers.letsencrypt.acme.email=${SOHWE_ACME_EMAIL:-dev@sohwe.localhost}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    networks:
      - sohwe_proxy

networks:
  sohwe_proxy:
    name: sohwe_proxy

volumes:
  postgres_data:
  traefik_acme: