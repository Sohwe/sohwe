## HTTPS overlay — applied on top of docker-compose.prod.yml when the
## operator provides a public domain + ACME email. `scripts/install.sh`
## writes SOHWE_COMPOSE_OVERLAYS into /etc/sohwe/sohwe.env so the `sohwe`
## wrapper runs `docker compose -f prod.yml -f https.yml ...` every time.

services:
  traefik:
    # Let's Encrypt HTTP-01 must reach Traefik on host port 80 (merged with
    # docker-compose.prod.yml port list).
    ports:
      - "80:80"
  dashboard:
    labels:
      # Replace the HTTP router from the base file with one that terminates
      # TLS on websecure and requests a Let's Encrypt cert for SOHWE_HOST.
      - "traefik.http.routers.sohwe.rule=Host(`${SOHWE_HOST}`)"
      - "traefik.http.routers.sohwe.entrypoints=websecure"
      - "traefik.http.routers.sohwe.tls=true"
      - "traefik.http.routers.sohwe.tls.certresolver=letsencrypt"
      # Separate :80 router that only redirects to HTTPS. Keeps ACME's HTTP-01
      # challenge working (Traefik internally short-circuits challenge paths).
      - "traefik.http.routers.sohwe-http.rule=Host(`${SOHWE_HOST}`)"
      - "traefik.http.routers.sohwe-http.entrypoints=web"
      - "traefik.http.routers.sohwe-http.priority=100"
      - "traefik.http.routers.sohwe-http.middlewares=sohwe-https-redirect"
      - "traefik.http.middlewares.sohwe-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sohwe-https-redirect.redirectscheme.permanent=true"
      # HTTP by IP or unknown host (e.g. http://203.0.113.4:8080). Host(SOHWE_HOST)
      # routers above do not match bare IP; without this Traefik returns 404.
      - "traefik.http.routers.sohwe-ip.rule=HostRegexp(`.*`) && !Host(`${SOHWE_HOST}`)"
      - "traefik.http.routers.sohwe-ip.entrypoints=web"
      - "traefik.http.routers.sohwe-ip.priority=1"
      - "traefik.http.routers.sohwe-ip.service=sohwe"
