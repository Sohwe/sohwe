## Sohwe — production compose file.
##
## Runtime lives under /etc/sohwe on the host:
##   /etc/sohwe/sohwe.env                  — generated by scripts/install.sh
##   /etc/sohwe/docker-compose.prod.yml    — this file (copied verbatim)
##   /etc/sohwe/docker-compose.https.yml   — overlay added when HTTPS is on
##
## All images are pulled from GHCR by default. Override SOHWE_IMAGE_* vars in
## sohwe.env to pin a different registry/tag (used by `sohwe rollback`).

name: sohwe

x-sohwe-env: &sohwe-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  SESSION_SECRET: ${SESSION_SECRET}
  SOHWE_ENCRYPTION_KEY: ${SOHWE_ENCRYPTION_KEY}
  # Drives the `Secure` flag on auth cookies. Must be "true" only when the
  # dashboard is actually served over HTTPS — set automatically by
  # scripts/install.sh when SOHWE_HOST is configured. HTTP-only deploys
  # leave this "false" so the browser will store the cookie.
  SOHWE_HTTPS_ENABLED: ${SOHWE_HTTPS_ENABLED:-false}
  # Base domain for deployed apps; routing label is `<slug>.<base-domain>`.
  # The worker reads this when it creates Traefik labels on user app
  # containers. The api echoes it through GET /api/config so the dashboard
  # can show the right URL. Default `sohwe.localhost` only resolves on this
  # host (curl with Host header or /etc/hosts) — set a real domain with a
  # wildcard A record for browser access.
  SOHWE_BASE_DOMAIN: ${SOHWE_BASE_DOMAIN:-sohwe.localhost}
  # Optional CORS allow-origin for the API. Empty (the default) means same-origin
  # only, which is correct because the dashboard nginx proxies /api on the same
  # origin. Set a comma-separated origin list only if the API is fronted
  # separately. Empty string leaves it unset, so the API's production default
  # (CORS disabled) applies.
  SOHWE_CORS_ORIGIN: ${SOHWE_CORS_ORIGIN:-}
  NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sohwe}
      POSTGRES_USER: ${POSTGRES_USER:-sohwe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sohwe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sohwe} -d ${POSTGRES_DB:-sohwe}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sohwe_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sohwe_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sohwe_internal

  traefik:
    # v3.7+ is required: older 3.x (incl. 3.1, 3.5, and 3.6.0) hardcoded
    # the Docker API version to 1.24 in the docker provider, which Docker
    # Engine 29.x rejects (its minimum supported API version is 1.40). The
    # provider then loops in an error state and never registers any
    # routers, so every request to the dashboard returns Traefik's default
    # "404 page not found". v3.7 dropped the hardcoded constant and uses
    # API version negotiation via the Docker SDK.
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Only consider containers on the public-facing proxy network.
      - --providers.docker.network=sohwe_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via HTTP-01. Only fires when a router opts in with
      # tls.certresolver=letsencrypt (dashboard does so via the https overlay;
      # managed user apps opt in per their domain configuration).
      - --certificatesresolvers.letsencrypt.acme.email=${SOHWE_ACME_EMAIL:-admin@sohwe.invalid}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      # Dashboard/API stays OFF in prod. Flip to true + set basic-auth to inspect.
      - --api.dashboard=false
      - --api.insecure=false
    # HTTP: map host port (default 8080 in fresh installs — see install.sh).
    # HTTPS overlay adds :80 for Let's Encrypt HTTP-01 when a domain is used.
    ports:
      - "${SOHWE_HTTP_PORT:-8080}:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - sohwe_traefik_acme:/letsencrypt
    networks:
      - sohwe_proxy

  api:
    image: ${SOHWE_IMAGE_API:-ghcr.io/sohwe/sohwe-api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *sohwe-env
      PORT: "3001"
      SOHWE_SETUP_PASSWORD: ${SOHWE_SETUP_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sohwe_internal
      - sohwe_proxy

  worker:
    image: ${SOHWE_IMAGE_WORKER:-ghcr.io/sohwe/sohwe-worker:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *sohwe-env
    # The worker needs the host Docker daemon to build user images and manage
    # user containers. Mounted read-write because it creates/destroys them.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      # Internal only. The worker never receives HTTP traffic itself; it
      # joins sohwe_proxy transiently via dockerode when it creates user app
      # containers, not by being on that network itself.
      - sohwe_internal

  dashboard:
    image: ${SOHWE_IMAGE_DASHBOARD:-ghcr.io/sohwe/sohwe-dashboard:latest}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      # Needs `sohwe_internal` so nginx can proxy /api -> api:3001, and
      # `sohwe_proxy` so Traefik can route external traffic to it.
      - sohwe_internal
      - sohwe_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sohwe_proxy"
      # HTTP-only router: match any Host (IP, localhost, etc.). PathPrefix(`/`)
      # alone has been unreliable for `/` on Traefik v3 + Docker in the wild.
      # The https overlay replaces this router set with Host(TLS) + IP fallback.
      - "traefik.http.routers.sohwe.rule=HostRegexp(`.*`)"
      - "traefik.http.routers.sohwe.entrypoints=web"
      - "traefik.http.routers.sohwe.priority=1"
      - "traefik.http.routers.sohwe.service=sohwe"
      - "traefik.http.services.sohwe.loadbalancer.server.port=80"

networks:
  # Public-facing: Traefik + dashboard + every managed user app attach here.
  # Name is fixed so managed containers created by the worker can join it by
  # name (matches packages/types/src — see Phase 1 in sohwe-getting-started.md).
  sohwe_proxy:
    name: sohwe_proxy
  # Platform-internal: postgres, redis, api, worker, dashboard. User apps
  # never join this network, so they can't reach the control plane directly.
  sohwe_internal:
    name: sohwe_internal

volumes:
  sohwe_postgres_data:
  sohwe_redis_data:
  sohwe_traefik_acme:
