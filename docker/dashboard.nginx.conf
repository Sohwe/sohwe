## Sohwe dashboard + same-origin API proxy.
##
## Why this exists: the SPA calls `/api/*` and `/health` as relative URLs
## (see apps/dashboard/vite.config.ts proxy in dev). In production we mirror
## that by having nginx forward those paths to the `api` service inside the
## docker-compose network. The browser only ever sees one origin, so CORS
## is irrelevant and session cookies work without SameSite gymnastics.

upstream sohwe_api {
    # Resolved against docker-compose's internal DNS. `api` is the service
    # name; the api listens on PORT=3001 by default.
    server api:3001;
}

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    # Traefik lives in front and terminates TLS when HTTPS is enabled, so
    # nginx itself always speaks plain HTTP on the internal sohwe_proxy net.

    root   /usr/share/nginx/html;
    index  index.html;

    # Security + caching defaults for a SPA.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Long-cache fingerprinted Vite bundles (files under /assets/ get hashes).
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell — it references the current bundle hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- API passthrough (same origin) ------------------------------------
    # Includes WebSocket/SSE upgrade headers in case routes like
    # /api/applications/:id/logs stream via SSE (Phase 4+).
    location /api/ {
        proxy_pass         http://sohwe_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass         http://sohwe_api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every non-asset path returns index.html so the client
    # router (TanStack Router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Map the Upgrade header so WebSocket/SSE proxying works. `$connection_upgrade`
# is "upgrade" when the client asked for one, otherwise empty (not "close").
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
